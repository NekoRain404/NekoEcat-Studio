# CI pipeline for NekoEcat Studio — build matrix, static analysis, coverage, tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CMAKE_BUILD_TYPE: Release
  # Headless CI: QApplication-based tests need an explicit Qt platform plugin.
  # Without this, test binaries abort at startup on runners without an X/Wayland
  # session (containers). Qt would otherwise try xcb and SIGABRT.
  QT_QPA_PLATFORM: offscreen

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            container: null
            qt_version: "6.2"
          - os: ubuntu-latest
            container: null
            qt_version: "6.5"
          - os: ubuntu-latest
            container: null
            qt_version: "6.7"
          - os: fedora-latest
            container: fedora:latest
            qt_version: "6.7"
          - os: archlinux
            container: archlinux:latest
            qt_version: "6.7"

    runs-on: ubuntu-latest
    container: ${{ matrix.container }}

    steps:
      - name: Install base tools (container)
        if: matrix.container != null
        run: |
          if command -v dnf &>/dev/null; then
            dnf install -y git cmake gcc gcc-c++ make tar gzip findutils
          elif command -v pacman &>/dev/null; then
            pacman -Syu --noconfirm git cmake gcc make tar gzip
          fi

      - uses: actions/checkout@v4

      - name: Install Qt6 (Ubuntu)
        if: matrix.container == null
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-tools-dev qt6-l10n-tools \
            libqt6network6 libqt6widgets6 libqt6test6 libqt6qml6

      - name: Install Qt6 (Fedora)
        if: matrix.container == 'fedora:latest'
        run: |
          dnf install -y qt6-qtbase-devel qt6-qttools-devel qt6-qtdeclarative-devel

      - name: Install Qt6 (Arch)
        if: matrix.container == 'archlinux:latest'
        run: |
          pacman -S --noconfirm qt6-base qt6-tools qt6-declarative

      - name: Install IgH EtherCAT headers/stub
        run: bash .github/workflows/ci/setup-ethercat-stub.sh

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }}

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure -j$(nproc)

      - name: GUI Smoke Test
        run: |
          if [ -f build/apps/ecat-studio/ecat-studio ]; then
            QT_QPA_PLATFORM=offscreen timeout 10 build/apps/ecat-studio/ecat-studio || true
          fi

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-tools-dev qt6-l10n-tools \
            libqt6network6 libqt6widgets6 libqt6test6 clang-tidy cppcheck

      - name: Install IgH EtherCAT headers/stub
        run: bash .github/workflows/ci/setup-ethercat-stub.sh

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: clang-tidy
        run: |
          find src apps -name '*.cpp' -o -name '*.h' | head -50 | \
            xargs -r clang-tidy -p build --quiet 2>&1 || true

      - name: cppcheck
        run: |
          cppcheck --enable=warning,style,performance,portability \
            --suppress=missingIncludeSystem \
            --error-exitcode=0 \
            -I src -I apps \
            src/ apps/ 2>&1

  format-check:
    runs-on: ubuntu-latest
    # Pre-existing debt: ~300 files predate the committed .clang-format and fail
    # this check (it has been red since July 2026). Keep it running so the
    # violations stay visible, but don't block the pipeline until a dedicated
    # formatting commit lands. Add "continue-on-error: false" back once clean.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Check formatting
        run: |
          find src apps tests -name '*.cpp' -o -name '*.h' | \
            xargs -r clang-format --dry-run --Werror 2>&1 || {
              echo "::error::Code formatting issues found. Run: find src apps tests -name '*.cpp' -o -name '*.h' | xargs clang-format -i"
              exit 1
            }

  valgrind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-tools-dev qt6-l10n-tools \
            libqt6network6 libqt6widgets6 libqt6test6 valgrind

      - name: Install IgH EtherCAT headers/stub
        run: bash .github/workflows/ci/setup-ethercat-stub.sh

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Valgrind tests
        run: |
          set -euo pipefail
          # Only fail on REAL defects: "definitely/indirectly lost" leaks and
          # invalid memory accesses. Qt widget tests always leave
          # "still reachable"/"possibly lost" records from internal caches
          # and connection lists -- run-valgrind.sh excludes those.
          # QT_QPA_PLATFORM=offscreen is inherited from the workflow env.
          failures=0
          while IFS= read -r bin; do
            [ -x "$bin" ] || continue
            echo "==> valgrind: $bin"
            if ! bash .github/workflows/ci/run-valgrind.sh "$bin"; then
              echo "::error::valgrind reported errors in $bin"
              failures=$((failures + 1))
            fi
          done < <(find build/tests -type f -executable -name '*_test')
          if [ "$failures" -gt 0 ]; then
            echo "::error::Valgrind failed for $failures test binary(ies)"
            exit 1
          fi

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-tools-dev qt6-l10n-tools \
            libqt6network6 libqt6widgets6 libqt6test6 lcov gcovr

      - name: Install IgH EtherCAT headers/stub
        run: bash .github/workflows/ci/setup-ethercat-stub.sh

      - name: Configure with coverage
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="--coverage"

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure -j$(nproc)

      - name: Generate coverage report
        run: |
          lcov --capture --directory build --output-file coverage.info
          lcov --remove coverage.info '/usr/*' '*/tests/*' --output-file coverage.info
          lcov --list coverage.info
          genhtml coverage.info --output-directory coverage-html

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-html/

      - name: Upload to Codecov
        if: github.event_name == 'push'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  advanced-analysis:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-tools-dev qt6-l10n-tools \
            libqt6network6 libqt6widgets6 libqt6test6 \
            lcov gcovr valgrind cppcheck clang-tidy clang-format

      - name: Install IgH EtherCAT headers/stub
        run: bash .github/workflows/ci/setup-ethercat-stub.sh

      - name: Coverage analysis
        run: bash scripts/analyze_coverage.sh

      - name: Memory leak check
        run: bash scripts/check_memory.sh

      - name: Code quality analysis
        run: bash scripts/check_quality.sh

      - name: Upload advanced reports
        uses: actions/upload-artifact@v4
        with:
          name: advanced-reports
          path: build/reports/
          retention-days: 30
